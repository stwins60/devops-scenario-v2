{% extends 'base.html' %}
{% block content %}
<div class="auth-container">
    <div class="glass-card auth-card">
        <div style="text-align: center; margin-bottom: 2rem;">
            <h2>Reset Password</h2>
            <p>Enter your email and we'll send you a recovery link.</p>
        </div>
        
        <form action="/forgot-password" method="POST">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 1rem; margin-top: 1rem;">Send Recovery Link</button>
        </form>
        
        <div class="auth-links">
            <p style="margin-top: 1rem;"><a href="/login">&larr; Back to Login</a></p>
        </div>
    </div>
</div>
{% endblock %}
