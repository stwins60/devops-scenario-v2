{% extends 'base.html' %}
{% block content %}
<div class="auth-container">
    <div class="glass-card auth-card">
        <div style="text-align: center; margin-bottom: 2rem;">
            <h2>Create Account</h2>
            <p>Join the premier DevOps training platform.</p>
        </div>
        
        <form action="/register" method="POST">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="name" class="form-control" placeholder="Jane Doe" required>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 1rem; margin-top: 1rem;">Create Account</button>
        </form>
        
        <div class="auth-links">
            <p style="margin-top: 1rem;">Already have an account? <a href="/login">Log In</a></p>
        </div>
    </div>
</div>
{% endblock %}
